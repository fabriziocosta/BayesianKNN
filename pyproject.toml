[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bayesian-model-averaging"
version = "0.1.0"
description = "Bayesian model averaging for k-nearest-neighbours, linear, and Gaussian predictors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BayesianModelAveraging contributors" }]
dependencies = [
    "joblib>=1.2",
    "numpy>=1.23.5",
    "scikit-learn>=1.2",
    "scipy>=1.9",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "pandas>=1.5",
]
dev = [
    "bayesian-model-averaging[test]",
    "bayesian-model-averaging[notebook]",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["bayesian_model_averaging"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
